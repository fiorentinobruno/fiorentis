<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Estudos — Fiorentis</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/theme.css?v=1792627350" />
<script src="/static/auth.js?v=1792627350"></script>
</head>
<body class="bg-slate-950 text-slate-300 min-h-screen overflow-x-hidden">

  <div id="header-root"></div>

  <main class="max-w-3xl mx-auto px-4 pt-6 pb-16">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-lg font-semibold text-slate-100">Estudos</h1>
      <button id="btn-novo-projeto"
        class="text-sm font-medium text-white bg-[color:var(--accent)] rounded-full px-4 py-2">
        + Projeto
      </button>
    </div>

    <div id="lista-vazia" class="hidden text-center text-slate-500 py-16">
      Nenhum projeto de estudo ainda. Curso, certificado, projeto pessoal — o que quiser.
    </div>

    <div id="lista-projetos" class="space-y-3"></div>
  </main>

  <!-- Modal criar/editar projeto -->
  <div id="modal-projeto" class="hidden fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center z-20">
    <div class="bg-slate-900 border border-slate-800 shadow-2xl w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl p-5 max-h-[90vh] overflow-y-auto">
      <form id="form-projeto">
        <label class="block text-sm font-medium text-slate-300 mb-1" id="projeto-titulo-modal">Novo projeto</label>
        <input id="projeto-titulo" type="text" required autocomplete="off" placeholder="Ex: Curso de IA, TCC, App pessoal…"
          class="w-full border border-slate-700 rounded-lg px-3 py-2 text-base mb-3 focus:outline-none focus:ring-2 focus:ring-[color:var(--accent)]" />

        <label class="block text-xs text-slate-400 mb-1">Status</label>
        <select id="projeto-status" class="w-full border border-slate-700 rounded-lg px-2 py-2 text-sm mb-3">
          <option value="nao_iniciado">Não iniciado</option>
          <option value="andando">Andando</option>
          <option value="pausado">Pausado</option>
          <option value="feito">Feito</option>
        </select>

        <label class="block text-xs text-slate-400 mb-1">Notas (plataforma, link, o que quiser)</label>
        <textarea id="projeto-notas" rows="3"
          class="w-full border border-slate-700 rounded-lg px-3 py-2 text-sm mb-3"></textarea>

        <div class="flex gap-2 mt-2">
          <button type="button" id="btn-projeto-excluir"
            class="hidden text-sm text-red-600 px-2">Excluir</button>
          <div class="flex-1"></div>
          <button type="button" id="btn-projeto-cancelar"
            class="py-2 px-4 rounded-lg border border-slate-700 text-slate-300">Cancelar</button>
          <button type="submit"
            class="py-2 px-4 rounded-lg bg-[color:var(--accent)] text-white font-medium">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal tarefas do projeto -->
  <div id="modal-projeto-tarefas" class="hidden fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center z-20">
    <div class="bg-slate-900 border border-slate-800 shadow-2xl w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-3">
        <h3 id="projeto-tarefas-titulo" class="text-sm font-semibold"></h3>
        <button type="button" id="btn-fechar-projeto-tarefas" class="icon-btn">×</button>
      </div>

      <ul id="projeto-tarefas-lista" class="space-y-2 mb-3"></ul>

      <div class="flex gap-2 mb-2">
        <input id="projeto-tarefa-input" type="text" autocomplete="off" placeholder="Nova tarefa"
          class="flex-1 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[color:var(--accent)]" />
      </div>
      <div id="projeto-tarefa-chips" class="flex gap-2 mb-2">
        <button type="button" class="chip" data-valor="15min">15min</button>
        <button type="button" class="chip" data-valor="30min">30min</button>
        <button type="button" class="chip" data-valor="1h">1h</button>
        <button type="button" class="chip" data-valor="2h+">2h+</button>
      </div>
      <button type="button" id="btn-projeto-tarefa-add" class="w-full px-3 py-2 rounded-lg bg-[color:var(--accent)] text-white text-sm font-medium">
        + Adicionar tarefa
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"
    class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-[color:var(--accent)] text-white text-sm px-4 py-2 rounded-full shadow-lg z-30">
  </div>

  <script src="/static/header.js?v=1792627350"></script>
  <script>initHeader({ menu: "estudos", pagina: "estudos" });</script>
  <script src="/static/shared.js?v=1792627350"></script>
  <script src="/static/estudos.js?v=1792627350"></script>
</body>
</html>
