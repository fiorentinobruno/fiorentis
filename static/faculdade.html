<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Faculdade — Fiorentis</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/theme.css?v=1792626631" />
<script src="/static/auth.js?v=1792626631"></script>
<style>
  @media (max-width: 1023px) {
    #grade-semana[data-dia-ativo] [data-dia] { display: none; }
    #grade-semana[data-dia-ativo="0"] [data-dia="0"],
    #grade-semana[data-dia-ativo="1"] [data-dia="1"],
    #grade-semana[data-dia-ativo="2"] [data-dia="2"],
    #grade-semana[data-dia-ativo="3"] [data-dia="3"],
    #grade-semana[data-dia-ativo="4"] [data-dia="4"] { display: table-cell; }
  }
</style>
</head>
<body class="bg-slate-950 text-slate-300 min-h-screen overflow-x-hidden">

  <div id="header-root"></div>

  <main class="max-w-[110rem] mx-auto px-4 pt-6 pb-28">
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-lg font-semibold text-slate-100">Grade horária</h1>
      <button id="btn-nova-disciplina"
        class="text-sm font-medium text-white bg-[color:var(--accent)] rounded-full px-4 py-2">
        + Disciplina
      </button>
    </div>

    <div id="grade-vazia" class="hidden text-center text-slate-500 py-10">
      Nenhuma disciplina cadastrada ainda.
    </div>

    <div class="flex flex-col lg:flex-row gap-6 items-start">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-sm flex-1 min-w-0 overflow-hidden">
        <div id="abas-dia" class="flex lg:hidden gap-1 p-2 border-b border-slate-800"></div>
        <div class="overflow-x-auto">
          <table id="grade-semana" class="w-full lg:min-w-[720px] border-collapse text-sm"></table>
        </div>
      </div>

      <div class="w-full lg:w-96 lg:shrink-0">
        <h2 class="text-sm font-semibold text-slate-400 mb-3">Disciplinas</h2>
        <div id="lista-disciplinas" class="space-y-3"></div>

        <div id="secao-semana" class="mt-6">
          <h2 class="text-sm font-semibold text-slate-400 mb-3">Essa semana</h2>
          <div id="semana-vazia" class="hidden text-sm text-slate-500 mb-3">Nada com prazo essa semana.</div>
          <div id="semana-lista" class="space-y-3"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal nova disciplina -->
  <div id="modal-disciplina" class="hidden fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center z-20">
    <div class="bg-slate-900 border border-slate-800 shadow-2xl w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl p-5 max-h-[90vh] overflow-y-auto">
      <form id="form-disciplina">
        <label class="block text-sm font-medium text-slate-300 mb-1" id="disc-titulo-modal">Nova disciplina</label>
        <input id="disc-nome" type="text" required autocomplete="off" placeholder="Nome da disciplina"
          class="w-full border border-slate-700 rounded-lg px-3 py-2 text-base mb-3 focus:outline-none focus:ring-2 focus:ring-[color:var(--accent)]" />

        <input id="disc-professor" type="text" autocomplete="off" placeholder="Professor"
          class="w-full border border-slate-700 rounded-lg px-3 py-2 text-sm mb-3" />

        <label class="block text-xs text-slate-400 mb-1">Horários na semana (cada um com sua sala)</label>
        <div id="disc-horarios" class="space-y-2 mb-2"></div>
        <button type="button" id="btn-add-horario" class="text-sm text-[color:var(--accent-soft)] font-medium mb-4">
          + Adicionar horário
        </button>

        <div class="flex gap-2 mt-2">
          <button type="button" id="btn-disciplina-excluir"
            class="hidden text-sm text-red-600 px-2">Excluir</button>
          <div class="flex-1"></div>
          <button type="button" id="btn-disciplina-cancelar"
            class="py-2 px-4 rounded-lg border border-slate-700 text-slate-300">Cancelar</button>
          <button type="submit"
            class="py-2 px-4 rounded-lg bg-[color:var(--accent)] text-white font-medium">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal tarefas/checklist da matéria -->
  <div id="modal-materia" class="hidden fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center z-20">
    <div class="bg-slate-900 border border-slate-800 shadow-2xl w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl p-5 max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-3">
        <h3 id="materia-modal-titulo" class="text-sm font-semibold"></h3>
        <button type="button" id="btn-fechar-materia" class="icon-btn">×</button>
      </div>

      <ul id="materia-modal-itens" class="space-y-2 mb-3"></ul>

      <div class="flex gap-2">
        <input id="materia-modal-input" type="text" autocomplete="off" placeholder="Adicionar tarefa/prova"
          class="flex-1 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[color:var(--accent)]" />
        <button type="button" id="btn-materia-add-item" class="px-3 py-2 rounded-lg bg-[color:var(--accent)] text-white text-sm font-medium">+</button>
      </div>
    </div>
  </div>

  <!-- Botão flutuante de captura rápida -->
  <button id="btn-capturar"
    class="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-[color:var(--accent)] text-white text-3xl leading-none
           flex items-center justify-center shadow-lg hover:opacity-90 active:scale-95 transition">
    +
  </button>

  <!-- Modal de captura rápida -->
  <div id="modal-captura" class="hidden fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center z-30">
    <div class="bg-slate-900 border border-slate-800 shadow-2xl w-full sm:max-w-sm sm:rounded-2xl rounded-t-2xl p-5 max-h-[90vh] overflow-y-auto">
      <form id="form-captura">
        <label class="block text-sm font-medium text-slate-300 mb-1">Novo item</label>
        <input id="input-titulo" type="text" required autocomplete="off"
          placeholder="O que você precisa lembrar?"
          class="w-full border border-slate-700 rounded-lg px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-[color:var(--accent)]" />

        <details class="mt-3">
          <summary class="text-sm text-slate-400 cursor-pointer select-none">+ Adicionar detalhes (opcional)</summary>

          <div class="mt-3 space-y-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Descrição</label>
              <textarea id="input-descricao" rows="2"
                class="w-full border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[color:var(--accent)]"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div class="min-w-0">
                <label class="block text-xs text-slate-400 mb-1">Tipo</label>
                <select id="input-tipo"
                  class="w-full border border-slate-700 rounded-lg px-2 py-2 text-sm">
                  <option value="">—</option>
                  <option value="tarefa">Tarefa</option>
                  <option value="nota">Nota</option>
                  <option value="evento">Evento</option>
                </select>
              </div>
              <div class="min-w-0">
                <label class="block text-xs text-slate-400 mb-1">Área</label>
                <select id="input-area"
                  class="w-full border border-slate-700 rounded-lg px-2 py-2 text-sm">
                  <option value="">—</option>
                  <option value="faculdade" selected>Faculdade</option>
                  <option value="trabalho">Trabalho</option>
                  <option value="namoro">Namoro</option>
                  <option value="pessoal">Pessoal</option>
                  <option value="estudos_externos">Estudos externos</option>
                  <option value="compras">Compras</option>
                  <option value="outro">Outro</option>
                </select>
              </div>
            </div>

            <div id="campo-input-disciplina" class="hidden">
              <label class="block text-xs text-slate-400 mb-1">Matéria</label>
              <select id="input-disciplina"
                class="w-full border border-slate-700 rounded-lg px-2 py-2 text-sm">
                <option value="">—</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div class="min-w-0">
                <label class="block text-xs text-slate-400 mb-1">Prioridade</label>
                <select id="input-prioridade"
                  class="w-full border border-slate-700 rounded-lg px-2 py-2 text-sm">
                  <option value="">—</option>
                  <option value="urgente">Urgente</option>
                  <option value="alta">Alta</option>
                  <option value="media">Média</option>
                  <option value="baixa">Baixa</option>
                </select>
              </div>
              <div class="min-w-0" id="campo-input-prazo">
                <label class="block text-xs text-slate-400 mb-1">Prazo</label>
                <input id="input-prazo" type="datetime-local"
                  class="w-full border border-slate-700 rounded-lg px-2 py-2 text-sm" />
              </div>
            </div>

            <div id="campo-input-data-evento">
              <label class="block text-xs text-slate-400 mb-1">Data do evento</label>
              <input id="input-data-evento" type="datetime-local"
                class="w-full border border-slate-700 rounded-lg px-2 py-2 text-sm" />
            </div>

            <div id="campo-input-tempo-estimado" class="hidden">
              <label class="block text-xs text-slate-400 mb-1">Tempo estimado</label>
              <div id="chips-input-tempo-estimado" class="flex gap-2 flex-wrap">
                <button type="button" class="chip" data-valor="15min">15min</button>
                <button type="button" class="chip" data-valor="30min">30min</button>
                <button type="button" class="chip" data-valor="1h">1h</button>
                <button type="button" class="chip" data-valor="2h+">2h+</button>
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">Lembrete</label>
              <select id="input-lembrete"
                class="w-full border border-slate-700 rounded-lg px-2 py-2 text-sm">
                <option value="">Sem lembrete</option>
                <option value="10">10 min antes</option>
                <option value="30">30 min antes</option>
                <option value="60">1 hora antes</option>
                <option value="1440">1 dia antes</option>
              </select>
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">Começar</label>
              <div class="flex gap-2 flex-wrap">
                <button type="button" id="input-inicio-hoje" class="text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 hover:border-[color:var(--accent)]">Hoje</button>
                <button type="button" id="input-inicio-amanha" class="text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 hover:border-[color:var(--accent)]">Amanhã</button>
                <button type="button" id="input-inicio-semana" class="text-xs px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 hover:border-[color:var(--accent)]">Semana que vem</button>
              </div>
              <input id="input-data-inicio" type="hidden" />
            </div>
          </div>
        </details>

        <div class="flex gap-2 mt-4">
          <button type="button" id="btn-cancelar"
            class="flex-1 py-2 rounded-lg border border-slate-700 text-slate-300">Cancelar</button>
          <button type="submit"
            class="flex-1 py-2 rounded-lg bg-[color:var(--accent)] text-white font-medium">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"
    class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-[color:var(--accent)] text-white text-sm px-4 py-2 rounded-full shadow-lg z-30">
  </div>

  <script src="/static/header.js?v=1792626631"></script>
  <script>initHeader({ menu: "faculdade", pagina: "faculdade" });</script>
  <script src="/static/shared.js?v=1792626631"></script>
  <script src="/static/faculdade.js?v=1792626631"></script>
</body>
</html>
