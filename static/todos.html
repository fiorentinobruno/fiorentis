<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Todos os itens — Fiorentis</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen overflow-x-hidden">

  <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-4 sticky top-0 z-10">
    <div class="flex items-start justify-between mb-3">
      <h1 class="text-lg font-semibold">Todos os itens</h1>
      <p class="text-sm text-slate-500" id="contagem"></p>
    </div>
    <nav class="flex gap-2 overflow-x-auto whitespace-nowrap -mx-4 px-4 sm:mx-0 sm:px-0 sm:flex-wrap sm:whitespace-normal">
      <a href="/" class="text-base font-medium text-slate-600 border border-slate-300 rounded-full px-5 py-2 hover:bg-slate-50">
        Hoje
      </a>
      <a href="/semana" class="text-base font-medium text-slate-600 border border-slate-300 rounded-full px-5 py-2 hover:bg-slate-50">
        Semana
      </a>
      <a href="/calendario" class="text-base font-medium text-slate-600 border border-slate-300 rounded-full px-5 py-2 hover:bg-slate-50">
        Calendário
      </a>
      <a href="/todos" class="text-base font-semibold text-white bg-slate-900 rounded-full px-5 py-2">
        Todos
      </a>
    </nav>
  </header>

  <main class="max-w-2xl mx-auto px-4 pt-6 pb-16">
    <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
      <button data-status="" class="filtro-status shrink-0 text-sm px-3 py-1 rounded-full border border-slate-300">Todos</button>
      <button data-status="inbox" class="filtro-status shrink-0 text-sm px-3 py-1 rounded-full border border-slate-300">Inbox</button>
      <button data-status="a_fazer" class="filtro-status shrink-0 text-sm px-3 py-1 rounded-full border border-slate-300">A fazer</button>
      <button data-status="em_andamento" class="filtro-status shrink-0 text-sm px-3 py-1 rounded-full border border-slate-300">Em andamento</button>
      <button data-status="feito" class="filtro-status shrink-0 text-sm px-3 py-1 rounded-full border border-slate-300">Concluídas</button>
      <button data-status="arquivado" class="filtro-status shrink-0 text-sm px-3 py-1 rounded-full border border-slate-300">Arquivadas</button>
    </div>

    <div id="lista-vazia" class="hidden text-center text-slate-400 py-16">
      Nada por aqui.
    </div>
    <ul id="lista-itens" class="space-y-3"></ul>
  </main>

  <!-- Botão flutuante de captura rápida -->
  <button id="btn-capturar"
    class="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-slate-900 text-white text-3xl leading-none
           flex items-center justify-center shadow-lg hover:bg-slate-700 active:scale-95 transition">
    +
  </button>

  <!-- Modal de captura rápida -->
  <div id="modal-captura" class="hidden fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-20">
    <div class="bg-white w-full sm:max-w-sm sm:rounded-xl rounded-t-xl p-4 max-h-[90vh] overflow-y-auto">
      <form id="form-captura">
        <label class="block text-sm font-medium text-slate-600 mb-1">Novo item</label>
        <input id="input-titulo" type="text" required autocomplete="off"
          placeholder="O que você precisa lembrar?"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-slate-900" />

        <details class="mt-3">
          <summary class="text-sm text-slate-500 cursor-pointer select-none">+ Adicionar detalhes (opcional)</summary>

          <div class="mt-3 space-y-3">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Descrição</label>
              <textarea id="input-descricao" rows="2"
                class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div class="min-w-0">
                <label class="block text-xs text-slate-500 mb-1">Tipo</label>
                <select id="input-tipo"
                  class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm">
                  <option value="">—</option>
                  <option value="tarefa">Tarefa</option>
                  <option value="nota">Nota</option>
                  <option value="evento">Evento</option>
                </select>
              </div>
              <div class="min-w-0">
                <label class="block text-xs text-slate-500 mb-1">Área</label>
                <select id="input-area"
                  class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm">
                  <option value="">—</option>
                  <option value="faculdade">Faculdade</option>
                  <option value="trabalho">Trabalho</option>
                  <option value="namoro">Namoro</option>
                  <option value="pessoal">Pessoal</option>
                  <option value="estudos_externos">Estudos externos</option>
                  <option value="compras">Compras</option>
                  <option value="outro">Outro</option>
                </select>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <div class="min-w-0">
                <label class="block text-xs text-slate-500 mb-1">Prioridade</label>
                <select id="input-prioridade"
                  class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm">
                  <option value="">—</option>
                  <option value="urgente">Urgente</option>
                  <option value="alta">Alta</option>
                  <option value="media">Média</option>
                  <option value="baixa">Baixa</option>
                </select>
              </div>
              <div class="min-w-0">
                <label class="block text-xs text-slate-500 mb-1">Prazo</label>
                <input id="input-prazo" type="datetime-local"
                  class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm" />
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-500 mb-1">Data do evento</label>
              <input id="input-data-evento" type="datetime-local"
                class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm" />
            </div>

            <div>
              <label class="block text-xs text-slate-500 mb-1">Lembrete</label>
              <select id="input-lembrete"
                class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm">
                <option value="">Sem lembrete</option>
                <option value="10">10 min antes</option>
                <option value="30">30 min antes</option>
                <option value="60">1 hora antes</option>
                <option value="1440">1 dia antes</option>
              </select>
            </div>

            <label class="flex items-center gap-2 text-sm text-slate-600">
              <input id="input-foco-hoje" type="checkbox" class="w-4 h-4 accent-slate-900" />
              Focar hoje
            </label>
          </div>
        </details>

        <div class="flex gap-2 mt-4">
          <button type="button" id="btn-cancelar"
            class="flex-1 py-2 rounded-lg border border-slate-300 text-slate-600">Cancelar</button>
          <button type="submit"
            class="flex-1 py-2 rounded-lg bg-slate-900 text-white font-medium">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de edição -->
  <div id="modal-editar" class="hidden fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-20">
    <div class="bg-white w-full sm:max-w-sm sm:rounded-xl rounded-t-xl p-4 max-h-[90vh] overflow-y-auto">
      <form id="form-editar">
        <label class="block text-sm font-medium text-slate-600 mb-1">Editar item</label>
        <input id="edit-titulo" type="text" required autocomplete="off"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-slate-900" />

        <div class="mt-3 space-y-3">
          <div>
            <label class="block text-xs text-slate-500 mb-1">Descrição</label>
            <textarea id="edit-descricao" rows="2"
              class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900"></textarea>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div class="min-w-0">
              <label class="block text-xs text-slate-500 mb-1">Tipo</label>
              <select id="edit-tipo" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm">
                <option value="">—</option>
                <option value="tarefa">Tarefa</option>
                <option value="nota">Nota</option>
                <option value="evento">Evento</option>
              </select>
            </div>
            <div class="min-w-0">
              <label class="block text-xs text-slate-500 mb-1">Área</label>
              <select id="edit-area" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm">
                <option value="">—</option>
                <option value="faculdade">Faculdade</option>
                <option value="trabalho">Trabalho</option>
                <option value="namoro">Namoro</option>
                <option value="pessoal">Pessoal</option>
                <option value="estudos_externos">Estudos externos</option>
                <option value="compras">Compras</option>
                <option value="outro">Outro</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div class="min-w-0">
              <label class="block text-xs text-slate-500 mb-1">Prioridade</label>
              <select id="edit-prioridade" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm">
                <option value="">—</option>
                <option value="urgente">Urgente</option>
                <option value="alta">Alta</option>
                <option value="media">Média</option>
                <option value="baixa">Baixa</option>
              </select>
            </div>
            <div class="min-w-0">
              <label class="block text-xs text-slate-500 mb-1">Status</label>
              <select id="edit-status" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm">
                <option value="inbox">Inbox</option>
                <option value="a_fazer">A fazer</option>
                <option value="em_andamento">Em andamento</option>
                <option value="feito">Feito</option>
                <option value="arquivado">Arquivado</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div class="min-w-0">
              <label class="block text-xs text-slate-500 mb-1">Prazo</label>
              <input id="edit-prazo" type="datetime-local"
                class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm" />
            </div>
            <div class="min-w-0">
              <label class="block text-xs text-slate-500 mb-1">Data do evento</label>
              <input id="edit-data-evento" type="datetime-local"
                class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm" />
            </div>
          </div>

          <div>
            <label class="block text-xs text-slate-500 mb-1">Lembrete</label>
            <select id="edit-lembrete"
              class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm">
              <option value="">Sem lembrete</option>
              <option value="10">10 min antes</option>
              <option value="30">30 min antes</option>
              <option value="60">1 hora antes</option>
              <option value="1440">1 dia antes</option>
            </select>
          </div>

          <label class="flex items-center gap-2 text-sm text-slate-600">
            <input id="edit-foco-hoje" type="checkbox" class="w-4 h-4 accent-slate-900" />
            Focar hoje
          </label>
        </div>

        <div class="flex gap-2 mt-4">
          <button type="button" id="btn-editar-excluir"
            class="text-sm text-red-600 px-2">Excluir</button>
          <div class="min-w-0"></div>
          <button type="button" id="btn-editar-cancelar"
            class="py-2 px-4 rounded-lg border border-slate-300 text-slate-600">Cancelar</button>
          <button type="submit"
            class="py-2 px-4 rounded-lg bg-slate-900 text-white font-medium">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast de confirmação -->
  <div id="toast"
    class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2 rounded-full shadow-lg z-30">
  </div>

  <script src="/static/shared.js"></script>
  <script src="/static/notifications.js"></script>
  <script src="/static/todos.js"></script>
</body>
</html>
